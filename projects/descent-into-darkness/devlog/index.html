    content="Development log for Descent Into Darkness — updates, patches, screenshots, and roadmap notes from CritNCoin Studios." />

  <!-- Three folders deep -> ../../../ -->

</head>
<body>

  <header class="site-header">
    <a class="nav-title" href="../../../index.html">
      <img src="../../../assets/images/branding/company-logo-title.png" alt="CritNCoin Studios crest" />

    <nav class="nav-links" aria-label="Primary">

      <div class="loading-spinner" aria-hidden="true"></div>
      <p class="text-center muted">Unsealing the dev log…</p>
    </div>

    <noscript>
      <div class="empty-panel mt-2">

        <p class="muted">The dev log is loaded dynamically. Enable JavaScript to read the entries.</p>
